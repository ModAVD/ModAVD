name: mirrorchyan_release_note

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ''
        required: false
        type: string
  release:
    types: [published, edited]

permissions:
  contents: read

jobs:
  mirrorchyan:
    if: ${{ github.repository_owner == 'ModAVD' }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Read release announcement
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          args=(--repo ModAVD/ModAVD --json tagName,body)
          if [[ -n "$RELEASE_TAG" ]]; then
            args=("$RELEASE_TAG" "${args[@]}")
          fi
          # RELEASING.md keeps detailed checksums and source inventories on GitHub.
          data=$(gh release view "${args[@]}" --jq '{tag: .tagName, note: ((.body // "") | split("<!-- modavd:github-only -->")[0])} | tojson')
          echo "data=$data" >> "$GITHUB_OUTPUT"

      # The action downloads python/upload.py from its mutable v1 branch unless
      # this file already exists, so fetch it from the pinned commit first.
      - name: Fetch pinned MirrorChyan release note script
        shell: bash
        env:
          SCRIPT_URL: https://raw.githubusercontent.com/MirrorChyan/release-note-action/f392b50c411981ee6d33c8ed5e91d66d84d56202/python/upload.py
        run: |
          curl -fsSL --retry 3 -o mirrorchyan_release_note.py "$SCRIPT_URL"
          python -m pip install aiohttp

      - uses: MirrorChyan/release-note-action@f392b50c411981ee6d33c8ed5e91d66d84d56202 # v1
        with:
          mirrorchyan_rid: ModAVD
          version_name: ${{ fromJSON(steps.release.outputs.data).tag }}
          release_note: ${{ fromJSON(steps.release.outputs.data).note }}

          owner: ModAVD
          repo: ModAVD
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
