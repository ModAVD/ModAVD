name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ''
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  mirrorchyan:
    if: ${{ github.repository_owner == 'ModAVD' }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: win
            arch: x64
            # Legacy mas builds and current platform-suffixed main packages.
            filename: 'ModAVD-{*-mas+([0-9]),*-win-x64}.zip'
    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ matrix.filename }}
          mirrorchyan_rid: ModAVD
          tag: ${{ inputs.tag || github.event.release.tag_name }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: ModAVD
          repo: ModAVD
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
