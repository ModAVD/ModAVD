name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ''
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  mirrorchyan:
    if: ${{ github.repository_owner == 'ModAVD' }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: win
            arch: x64
            # Legacy mas builds and current platform-suffixed main packages.
            filename: 'ModAVD-{*-mas+([0-9]),*-win-x64}.zip'
    steps:
      # The action downloads python/upload.py from its mutable v1 branch unless
      # this file already exists, so fetch it from the pinned commit first.
      - name: Fetch pinned MirrorChyan upload script
        shell: bash
        env:
          SCRIPT_URL: https://raw.githubusercontent.com/MirrorChyan/uploading-action/cca679d5e75017ac9ae236b55406b27f6f24c7db/python/upload.py
        run: |
          curl -fsSL --retry 3 -o mirrorchyan_uploading.py "$SCRIPT_URL"
          python -m pip install requests

      - uses: MirrorChyan/uploading-action@cca679d5e75017ac9ae236b55406b27f6f24c7db # v1
        with:
          filetype: latest-release
          filename: ${{ matrix.filename }}
          mirrorchyan_rid: ModAVD
          tag: ${{ inputs.tag || github.event.release.tag_name }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: ModAVD
          repo: ModAVD
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
